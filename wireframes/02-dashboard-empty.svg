<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="900" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold" fill="#0f172a">W2 — Панель наблюдения, пациент не выбран</text>
  <text x="24" y="58" font-size="13" fill="#64748b">Вид #app-view · состояние после входа · сетка: сайдбар 280px + основная область</text>

  <!-- Browser frame -->
  <rect x="40" y="80" width="1200" height="640" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="40" y1="116" x2="1240" y2="116" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="64" cy="98" r="6" fill="none" stroke="#94a3b8"/>
  <circle cx="84" cy="98" r="6" fill="none" stroke="#94a3b8"/>
  <circle cx="104" cy="98" r="6" fill="none" stroke="#94a3b8"/>

  <!-- Sidebar -->
  <rect x="40" y="116" width="280" height="604" fill="#f1f5f9" stroke="#cbd5e1"/>
  <!-- sidebar header -->
  <text x="64" y="152" font-size="16" font-weight="bold" fill="#334155">Пациенты</text>
  <rect x="236" y="134" width="66" height="28" rx="6" fill="none" stroke="#94a3b8"/>
  <text x="269" y="152" font-size="11" fill="#64748b" text-anchor="middle">Выйти</text>
  <line x1="40" y1="174" x2="320" y2="174" stroke="#cbd5e1"/>

  <!-- add form -->
  <rect x="58" y="188" width="118" height="32" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="68" y="208" font-size="11" fill="#94a3b8">Имя</text>
  <rect x="184" y="188" width="118" height="32" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="194" y="208" font-size="11" fill="#94a3b8">Фамилия</text>
  <rect x="58" y="228" width="244" height="32" rx="6" fill="#e2e8f0" stroke="#64748b"/>
  <text x="180" y="248" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">+ Добавить</text>
  <line x1="40" y1="274" x2="320" y2="274" stroke="#cbd5e1"/>

  <!-- patient list -->
  <g>
    <rect x="40" y="274" width="280" height="52" fill="#ffffff"/>
    <text x="64" y="305" font-size="13" fill="#334155">Иван Петров</text>
    <rect x="216" y="288" width="88" height="22" rx="11" fill="#dcfce7" stroke="#86efac"/>
    <text x="260" y="303" font-size="10" fill="#16a34a" text-anchor="middle">наблюдение</text>
    <line x1="40" y1="326" x2="320" y2="326" stroke="#e2e8f0"/>

    <rect x="40" y="326" width="280" height="52" fill="#ffffff"/>
    <text x="64" y="357" font-size="13" fill="#334155">Анна Сидорова</text>
    <rect x="240" y="340" width="64" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="272" y="355" font-size="10" fill="#94a3b8" text-anchor="middle">пауза</text>
    <line x1="40" y1="378" x2="320" y2="378" stroke="#e2e8f0"/>

    <rect x="40" y="378" width="280" height="52" fill="#ffffff"/>
    <text x="64" y="409" font-size="13" fill="#334155">Пётр Иванов</text>
    <rect x="240" y="392" width="64" height="22" rx="11" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="272" y="407" font-size="10" fill="#94a3b8" text-anchor="middle">пауза</text>
    <line x1="40" y1="430" x2="320" y2="430" stroke="#e2e8f0"/>
  </g>

  <!-- Main: placeholder -->
  <rect x="480" y="380" width="600" height="60" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="6 5"/>
  <text x="780" y="415" font-size="14" fill="#94a3b8" text-anchor="middle">Выберите пациента слева, чтобы начать наблюдение</text>

  <!-- Callouts -->
  <circle cx="345" cy="244" r="12" fill="#2563eb"/>
  <text x="345" y="249" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  <line x1="333" y1="244" x2="306" y2="244" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="345" cy="300" r="12" fill="#2563eb"/>
  <text x="345" y="305" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
  <line x1="333" y1="300" x2="308" y2="300" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="345" cy="152" r="12" fill="#2563eb"/>
  <text x="345" y="157" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
  <line x1="333" y1="152" x2="306" y2="152" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="740" width="1200" height="140" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="766" font-size="13" font-weight="bold" fill="#334155">Аннотации</text>
  <text x="60" y="790" font-size="12" fill="#475569">① Регистрация: POST /api/v1/patients {firstName, lastName} → пациент появляется в списке, форма очищается.</text>
  <text x="60" y="812" font-size="12" fill="#475569">② Элемент списка: ФИО + бейдж статуса мониторинга (зелёный «наблюдение» / серый «пауза»). Клик → выбор пациента, переход к W3.</text>
  <text x="60" y="834" font-size="12" fill="#475569">    У выбранного пациента с активными инцидентами справа дополнительно красный бейдж-счётчик (см. W4).</text>
  <text x="60" y="856" font-size="12" fill="#475569">③ «Выйти» — сброс JWT из localStorage, закрытие SSE-подписок, возврат к W1.</text>
</svg>
