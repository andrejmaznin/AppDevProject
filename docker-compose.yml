services:
  postgres:
    image: postgres:16-alpine
    container_name: patient-db
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d patient_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: patient-app
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/patient_db
      SPRING_R2DBC_USERNAME: dbuser
      SPRING_R2DBC_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  frontend:
    image: nginx:alpine
    container_name: patient-frontend
    ports:
      - "80:80"
      - "5173:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

networks:
  default:
    name: patient-monitoring-network
