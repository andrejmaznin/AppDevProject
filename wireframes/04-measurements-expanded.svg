<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1060" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1060" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold" fill="#0f172a">W4 — Раскрытый список измерений (фрагмент карточки графика)</text>
  <text x="24" y="58" font-size="13" fill="#64748b">Состояние после нажатия «Измерения ▼» · по умолчанию список скрыт</text>

  <!-- Chart card with expanded panel -->
  <rect x="140" y="90" width="1000" height="610" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="126" font-size="15" font-weight="bold" fill="#334155">Частота пульса</text>
  <text x="310" y="126" font-size="11" fill="#94a3b8">норма 60–90 bpm</text>
  <text x="930" y="132" font-size="26" font-weight="bold" fill="#334155" text-anchor="end">74.7</text>
  <text x="940" y="132" font-size="12" fill="#94a3b8">bpm</text>
  <rect x="985" y="104" width="130" height="32" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="1050" y="125" font-size="12" fill="#2563eb" text-anchor="middle" font-weight="bold">Измерения ▲</text>

  <!-- chart area (compressed) -->
  <rect x="170" y="152" width="945" height="170" fill="#fcfdfe" stroke="#e2e8f0"/>
  <rect x="170" y="190" width="945" height="86" fill="#dcfce7" opacity="0.45"/>
  <line x1="170" y1="190" x2="1115" y2="190" stroke="#86efac" stroke-dasharray="5 4"/>
  <line x1="170" y1="276" x2="1115" y2="276" stroke="#86efac" stroke-dasharray="5 4"/>
  <polyline points="190,236 260,225 330,242 400,230 470,218 540,240 610,250 680,234 750,222 820,230 890,246 960,238 1030,226 1090,233"
            fill="none" stroke="#64748b" stroke-width="2"/>
  <circle cx="1090" cy="233" r="4" fill="#334155"/>

  <!-- divider -->
  <line x1="170" y1="344" x2="1115" y2="344" stroke="#cbd5e1"/>

  <!-- measurements table -->
  <text x="178" y="372" font-size="11" fill="#94a3b8">ВРЕМЯ</text>
  <text x="950" y="372" font-size="11" fill="#94a3b8" text-anchor="end">ЗНАЧЕНИЕ</text>
  <text x="1000" y="372" font-size="11" fill="#94a3b8">ЕД.</text>

  <g font-size="13">
    <text x="178" y="400" fill="#64748b">13:18:20</text>
    <text x="950" y="400" fill="#334155" text-anchor="end" font-weight="bold">74.7</text>
    <text x="1000" y="400" fill="#94a3b8">bpm</text>
    <line x1="170" y1="412" x2="1115" y2="412" stroke="#eef2f7"/>

    <text x="178" y="436" fill="#64748b">13:18:19</text>
    <text x="950" y="436" fill="#334155" text-anchor="end" font-weight="bold">73.5</text>
    <text x="1000" y="436" fill="#94a3b8">bpm</text>
    <line x1="170" y1="448" x2="1115" y2="448" stroke="#eef2f7"/>

    <rect x="170" y="454" width="945" height="32" fill="#fee2e2" opacity="0.55"/>
    <text x="178" y="474" fill="#64748b">13:18:18</text>
    <text x="950" y="474" fill="#dc2626" text-anchor="end" font-weight="bold">93.1</text>
    <text x="1000" y="474" fill="#94a3b8">bpm</text>
    <line x1="170" y1="486" x2="1115" y2="486" stroke="#eef2f7"/>

    <text x="178" y="510" fill="#64748b">13:18:17</text>
    <text x="950" y="510" fill="#334155" text-anchor="end" font-weight="bold">88.4</text>
    <text x="1000" y="510" fill="#94a3b8">bpm</text>
    <line x1="170" y1="522" x2="1115" y2="522" stroke="#eef2f7"/>

    <text x="178" y="546" fill="#64748b">13:18:16</text>
    <text x="950" y="546" fill="#334155" text-anchor="end" font-weight="bold">85.0</text>
    <text x="1000" y="546" fill="#94a3b8">bpm</text>
    <line x1="170" y1="558" x2="1115" y2="558" stroke="#eef2f7"/>

    <text x="178" y="582" fill="#64748b">13:18:15</text>
    <text x="950" y="582" fill="#334155" text-anchor="end" font-weight="bold">81.2</text>
    <text x="1000" y="582" fill="#94a3b8">bpm</text>
    <line x1="170" y1="594" x2="1115" y2="594" stroke="#eef2f7"/>

    <text x="178" y="618" fill="#64748b">13:18:14</text>
    <text x="950" y="618" fill="#334155" text-anchor="end" font-weight="bold">78.9</text>
    <text x="1000" y="618" fill="#94a3b8">bpm</text>
  </g>

  <!-- scroll hint -->
  <rect x="1100" y="360" width="6" height="320" rx="3" fill="#eef2f7"/>
  <rect x="1100" y="360" width="6" height="120" rx="3" fill="#cbd5e1"/>
  <text x="642" y="668" font-size="11" fill="#94a3b8" text-anchor="middle">… до 30 последних измерений, прокрутка (max-height 220px)</text>

  <!-- Sidebar badge fragment -->
  <text x="140" y="760" font-size="14" font-weight="bold" fill="#0f172a">Фрагмент сайдбара: бейдж активных инцидентов</text>
  <rect x="140" y="775" width="280" height="52" fill="#e0e7ff" stroke="#cbd5e1"/>
  <rect x="140" y="775" width="4" height="52" fill="#2563eb"/>
  <text x="160" y="806" font-size="13" font-weight="bold" fill="#1e293b">Иван Петров</text>
  <rect x="290" y="789" width="88" height="22" rx="11" fill="#dcfce7" stroke="#86efac"/>
  <text x="334" y="804" font-size="10" fill="#16a34a" text-anchor="middle">наблюдение</text>
  <circle cx="398" cy="800" r="10" fill="#dc2626"/>
  <text x="398" y="804" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">1</text>

  <!-- Callouts -->
  <circle cx="1160" cy="120" r="12" fill="#2563eb"/>
  <text x="1160" y="125" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  <line x1="1148" y1="120" x2="1120" y2="120" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="1160" cy="470" r="12" fill="#2563eb"/>
  <text x="1160" y="475" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
  <line x1="1148" y1="470" x2="1120" y2="470" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="445" cy="800" r="12" fill="#2563eb"/>
  <text x="445" y="805" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
  <line x1="433" y1="800" x2="412" y2="800" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="860" width="1200" height="176" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="886" font-size="13" font-weight="bold" fill="#334155">Аннотации</text>
  <text x="60" y="912" font-size="12" fill="#475569">① Кнопка-тоггл: «Измерения ▼» → «Измерения ▲», активное состояние подсвечено. Список строится из того же буфера, что и график.</text>
  <text x="60" y="934" font-size="12" fill="#475569">② Свежие записи сверху; обновление в реальном времени с каждым SSE-кадром. Значение вне нормы — красное, строка подсвечена.</text>
  <text x="60" y="956" font-size="12" fill="#475569">③ Красный бейдж-счётчик активных инцидентов у выбранного пациента в списке; обновляется по событиям SSE /incidents/stream.</text>
  <text x="60" y="978" font-size="12" fill="#475569">Повторное нажатие на «Измерения ▲» сворачивает панель; состояние раскрытия не сохраняется при смене пациента.</text>
</svg>
