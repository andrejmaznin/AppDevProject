<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1100" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1100" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold" fill="#0f172a">W5 — База знаний: справочник ошибок API</text>
  <text x="24" y="58" font-size="13" fill="#64748b">Вид #kb-panel · открывается кнопкой внизу сайдбара · данные: GET /api/v1/problems (RFC 9457)</text>

  <!-- Frame -->
  <rect x="40" y="80" width="1200" height="780" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Sidebar -->
  <rect x="40" y="80" width="280" height="780" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="64" y="116" font-size="16" font-weight="bold" fill="#334155">Пациенты</text>
  <text x="64" y="160" font-size="12" fill="#94a3b8">… список пациентов (см. W2)</text>
  <line x1="40" y1="790" x2="320" y2="790" stroke="#cbd5e1"/>
  <rect x="58" y="806" width="244" height="36" rx="6" fill="#e0e7ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="180" y="829" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">📖 База знаний</text>

  <!-- Panel header -->
  <text x="360" y="136" font-size="22" font-weight="bold" fill="#1e293b">База знаний</text>
  <text x="360" y="158" font-size="12" fill="#94a3b8">справочник ошибок API (RFC 9457 Problem Details)</text>

  <!-- Controls -->
  <rect x="360" y="182" width="800" height="646" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="384" y="206" width="560" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="398" y="229" font-size="12" fill="#94a3b8">Поиск по типу, названию, описанию…</text>
  <rect x="956" y="206" width="180" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1046" y="229" font-size="12" fill="#475569" text-anchor="middle">все статусы ▾</text>

  <!-- KB item 1 -->
  <rect x="384" y="262" width="752" height="170" rx="8" fill="#fcfdfe" stroke="#cbd5e1"/>
  <rect x="400" y="278" width="240" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="410" y="294" font-size="11" fill="#2563eb" font-family="monospace">/problems/patient-not-found</text>
  <rect x="1076" y="278" width="44" height="22" rx="11" fill="#fef9c3" stroke="#fde047"/>
  <text x="1098" y="293" font-size="11" font-weight="bold" fill="#a16207" text-anchor="middle">404</text>
  <text x="400" y="330" font-size="15" font-weight="bold" fill="#334155">Пациент не найден</text>
  <text x="400" y="356" font-size="10" fill="#94a3b8">КОГДА ВОЗНИКАЕТ</text>
  <text x="400" y="374" font-size="12" fill="#475569">Идентификатор пациента не существует в базе: пациент не был зарегистрирован либо ссылка устарела.</text>
  <text x="400" y="398" font-size="10" fill="#94a3b8">КАК УСТРАНИТЬ</text>
  <text x="400" y="416" font-size="12" fill="#475569">Обновите список пациентов и повторите операцию из актуальной карточки…</text>

  <!-- KB item 2 -->
  <rect x="384" y="448" width="752" height="170" rx="8" fill="#fcfdfe" stroke="#cbd5e1"/>
  <rect x="400" y="464" width="250" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="410" y="480" font-size="11" fill="#2563eb" font-family="monospace">/problems/invalid-credentials</text>
  <rect x="1076" y="464" width="44" height="22" rx="11" fill="#fef9c3" stroke="#fde047"/>
  <text x="1098" y="479" font-size="11" font-weight="bold" fill="#a16207" text-anchor="middle">401</text>
  <text x="400" y="516" font-size="15" font-weight="bold" fill="#334155">Неверные учётные данные</text>
  <text x="400" y="542" font-size="10" fill="#94a3b8">КОГДА ВОЗНИКАЕТ</text>
  <text x="400" y="560" font-size="12" fill="#475569">Пара логин/пароль не подошла при выпуске токена (POST /api/v1/auth/token)…</text>
  <text x="400" y="584" font-size="10" fill="#94a3b8">КАК УСТРАНИТЬ</text>
  <text x="400" y="602" font-size="12" fill="#475569">Проверьте логин и пароль (раскладку, регистр). Стартовая учётная запись: admin / admin123…</text>

  <!-- KB item 3 (500) -->
  <rect x="384" y="634" width="752" height="170" rx="8" fill="#fcfdfe" stroke="#cbd5e1"/>
  <rect x="400" y="650" width="210" height="24" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="410" y="666" font-size="11" fill="#2563eb" font-family="monospace">/problems/internal-error</text>
  <rect x="1076" y="650" width="44" height="22" rx="11" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="1098" y="665" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">500</text>
  <text x="400" y="702" font-size="15" font-weight="bold" fill="#334155">Внутренняя ошибка сервера</text>
  <text x="400" y="728" font-size="10" fill="#94a3b8">КОГДА ВОЗНИКАЕТ</text>
  <text x="400" y="746" font-size="12" fill="#475569">Непредвиденное исключение на сервере; детали записаны в лог приложения.</text>
  <text x="400" y="770" font-size="10" fill="#94a3b8">КАК УСТРАНИТЬ</text>
  <text x="400" y="788" font-size="12" fill="#475569">Повторите запрос; проверьте логи контейнера app (docker compose logs app)…</text>

  <!-- Callouts -->
  <circle cx="345" cy="824" r="12" fill="#2563eb"/>
  <text x="345" y="829" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  <line x1="333" y1="824" x2="308" y2="824" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="1190" cy="224" r="12" fill="#2563eb"/>
  <text x="1190" y="229" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
  <line x1="1178" y1="224" x2="1142" y2="224" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="1190" cy="289" r="12" fill="#2563eb"/>
  <text x="1190" y="294" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
  <line x1="1178" y1="289" x2="1126" y2="289" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="880" width="1200" height="196" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="906" font-size="13" font-weight="bold" fill="#334155">Аннотации</text>
  <text x="60" y="932" font-size="12" fill="#475569">① Кнопка внизу сайдбара открывает Базу знаний; выбор пациента в списке возвращает к карточке (W3), SSE-подписки при этом закрываются.</text>
  <text x="60" y="954" font-size="12" fill="#475569">② Фильтрация на клиенте: текстовый поиск по всем полям (тип, название, описание, устранение) + селектор HTTP-статуса; пустой результат — подсказка.</text>
  <text x="60" y="976" font-size="12" fill="#475569">③ Карточка типа: URI типа (значение поля type в ответе об ошибке), бейдж статуса (4xx — жёлтый, 5xx — красный), название,</text>
  <text x="60" y="998" font-size="12" fill="#475569">    «Когда возникает» и «Как устранить». Источник — GET /api/v1/problems (открыт без аутентификации), кэшируется на сессию.</text>
  <text x="60" y="1020" font-size="12" fill="#475569">Каталог типов на бэкенде — enum ProblemType: те же URI приходят в поле type каждого ответа об ошибке (RFC 9457).</text>
</svg>
