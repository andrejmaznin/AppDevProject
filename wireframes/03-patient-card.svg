  <!-- Legend -->
  <rect x="40" y="1820" width="1200" height="240" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="1846" font-size="13" font-weight="bold" fill="#334155">Аннотации</text>
  <text x="60" y="1872" font-size="12" fill="#475569">① «Старт» заблокирован (мониторинг уже активен), «Стоп» доступен; на время запроса блокируются обе кнопки — защита от двойного клика.</text>
  <text x="60" y="1894" font-size="12" fill="#475569">② Индикатор SSE-подключения: «поток активен» (зелёный) / «переподключение…» (серый, авто-retry каждые 2 с).</text>
  <text x="60" y="1916" font-size="12" fill="#475569">③ Карточка графика: при открытии предзаполняется историей (GET /measurements, до 100 точек на метрику), далее живые точки из SSE.</text>
  <text x="60" y="1938" font-size="12" fill="#475569">    Зелёная зона — нормальный диапазон; min/max-даунсемплинг до ~240 точек; ось X — реальное время.</text>
  <text x="60" y="1960" font-size="12" fill="#475569">④ Критическое состояние: значение вне нормы → число краснеет и пульсирует, точка на графике красная (карточка показана с выделенной рамкой условно).</text>
  <text x="60" y="1982" font-size="12" fill="#475569">⑤ Инциденты: история по GET /incidents + мгновенные события по SSE /incidents/stream; активная строка подсвечена, бейдж-счётчик пульсирует.</text>
  <text x="60" y="2004" font-size="12" fill="#475569">⑥ Статистика: GET /statistics?from=&amp;to= — среднее, дисперсия, квартили, мин/макс; интервал 5 мин / 15 мин / 1 ч / 24 ч; «—» при отсутствии данных.</text>
  <text x="60" y="2026" font-size="12" fill="#475569">⑦ Кнопка «Измерения ▼» на каждой карточке разворачивает таблицу последних 30 значений (см. W4).</text>
</svg>
