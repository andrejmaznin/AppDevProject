services:
  postgres:
    image: postgres:16-alpine
    container_name: patient-db
    environment:
      POSTGRES_DB: patient_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d patient_db"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: patient-monitoring-network
