<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1280" height="860" fill="#ffffff"/>
  <text x="24" y="36" font-size="20" font-weight="bold" fill="#0f172a">W1 — Экран входа</text>
  <text x="24" y="58" font-size="13" fill="#64748b">Маршрут: / (вид #login-view) · показывается при отсутствии или истечении JWT</text>

  <!-- Browser frame -->
  <rect x="40" y="80" width="1200" height="620" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="40" y1="116" x2="1240" y2="116" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="64" cy="98" r="6" fill="none" stroke="#94a3b8"/>
  <circle cx="84" cy="98" r="6" fill="none" stroke="#94a3b8"/>
  <circle cx="104" cy="98" r="6" fill="none" stroke="#94a3b8"/>
  <rect x="130" y="88" width="420" height="20" rx="10" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="145" y="102" font-size="11" fill="#94a3b8">http://localhost/</text>

  <!-- Login card (centered) -->
  <rect x="455" y="220" width="370" height="350" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="487" y="270" font-size="22" font-weight="bold" fill="#334155">Patient Monitoring</text>
  <text x="487" y="294" font-size="12" fill="#94a3b8">Войдите для доступа к панели наблюдения</text>

  <text x="487" y="330" font-size="11" fill="#64748b">ЛОГИН</text>
  <rect x="487" y="338" width="306" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>

  <text x="487" y="402" font-size="11" fill="#64748b">ПАРОЛЬ</text>
  <rect x="487" y="410" width="306" height="38" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="500" y="435" font-size="14" fill="#cbd5e1">••••••••</text>

  <rect x="487" y="472" width="306" height="40" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="640" y="497" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Войти</text>

  <!-- error placeholder -->
  <rect x="487" y="524" width="306" height="26" rx="4" fill="none" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="640" y="541" font-size="11" fill="#94a3b8" text-anchor="middle">область ошибки (скрыта по умолчанию)</text>

  <!-- Callouts -->
  <circle cx="440" cy="357" r="12" fill="#2563eb"/>
  <text x="440" y="362" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
  <line x1="452" y1="357" x2="485" y2="357" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="840" cy="492" r="12" fill="#2563eb"/>
  <text x="840" y="497" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
  <line x1="828" y1="492" x2="795" y2="492" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <circle cx="840" cy="537" r="12" fill="#2563eb"/>
  <text x="840" y="542" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
  <line x1="828" y1="537" x2="795" y2="537" stroke="#2563eb" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="40" y="720" width="1200" height="116" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="746" font-size="13" font-weight="bold" fill="#334155">Аннотации</text>
  <text x="60" y="770" font-size="12" fill="#475569">① POST /api/v1/auth/token {username, password} → JWT сохраняется в localStorage; до ответа кнопка «Войти» заблокирована.</text>
  <text x="60" y="792" font-size="12" fill="#475569">② Успех → переход к W2 (список пациентов загружается сразу). Стартовая учётная запись: admin / admin123.</text>
  <text x="60" y="814" font-size="12" fill="#475569">③ Ошибка 401 → detail из RFC 7807 Problem Details («Invalid credentials») появляется в области ошибки, поля не очищаются.</text>
</svg>
